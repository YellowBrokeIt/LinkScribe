name: Independent LinkScribe QA

on:
  push:
    branches: ['qa/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-test-matrix:
    name: API and regressions / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install real app dependencies and test tools
        run: python -m pip install -r requirements.txt pytest httpx
      - name: All unit/API and independent tests
        run: python -m pytest -q
      - name: Verify packaging and shell scripts
        run: |
          python -m compileall -q app.py library.py sources.py enhancements.py runtime_check.py
          python -m pip check
          bash -n start_linux.sh launch.sh

  real-speech-integration:
    name: Real file upload / PyAV / Whisper / SQLite / exports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api-test-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install synthesis tool and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -r requirements.txt pytest httpx
      - name: Generate owned sample speech locally
        run: |
          espeak-ng -v en -s 125 -a 170 -w /tmp/linkscr-qa-voice.wav 'Hello. This is an independent speech recognition test. I am speaking these words for the LinkScribe app.'
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/linkscr-qa-voice.wav
      - name: Exercise full actual audio pipeline (downloads open-source Whisper tiny model)
        env:
          LINKSCRIBE_DEVICE: cpu
          HF_HUB_DISABLE_TELEMETRY: '1'
          LINKSCRIBE_QA_AUDIO: /tmp/linkscr-qa-voice.wav
        run: PYTHONPATH=. python tests/smoke_real_speech.py

  fresh-linux-install:
    name: Fresh Linux installation and health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the actual Linux launcher from a fresh checkout
        run: |
          set -euo pipefail
          bash start_linux.sh > /tmp/linkscr-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          healthy=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8765/health > /tmp/linkscr-health.json; then
              healthy=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/linkscr-smoke.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$healthy" != 1 ]]; then
            cat /tmp/linkscr-smoke.log
            exit 1
          fi
          python - <<'PY'
          import json
          from urllib.request import urlopen
          health=json.load(open('/tmp/linkscr-health.json'))
          assert health['status']=='ok',health
          assert health['service']=='LinkScribe',health
          assert 'js_runtime' in health,health
          with urlopen('http://127.0.0.1:8765/') as response:
              html=response.read().decode('utf-8')
              assert '<title>LinkScribe' in html
          with urlopen('http://127.0.0.1:8765/api/library') as response:
              saved=json.load(response)
              assert saved=={'items':[]},saved
          print('Fresh Ubuntu clone, start_linux.sh, /health, homepage, library endpoint: PASS')
          PY
