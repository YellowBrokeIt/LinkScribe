name: LinkScribe tests
on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Unit and API tests (no external transcription required)
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q app.py sources.py enhancements.py library.py runtime_check.py
