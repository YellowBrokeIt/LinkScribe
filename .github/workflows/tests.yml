name: LinkScribe tests
on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  unit-tests:
    name: Unit and API / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx 'pyannote.core==6.1.0'
      - name: Unit and API tests (no external transcription required)
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q app.py sources.py enhancements.py library.py runtime_check.py
